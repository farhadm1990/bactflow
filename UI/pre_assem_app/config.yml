name: bactflow
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - curl=8.21.0
  - libcurl=8.21.0
  - pkg-config=0.29.2
  - python=3.11.0
  # Nextflow 24.x requires Java 17-24; do not upgrade to OpenJDK 25+
  - openjdk=21
  - nextflow=24.10.2
  - gsl=2.7
  - htslib=1.23.1
  - bcftools=1.24
  - samtools=1.23.1
  - numpy=2.4.6
  - biopython=1.88
  - pysam=0.23.0
  - pandas=3.0.5
  - tensordict=0.11.0
  - nanomath=1.4.0
  - deprecated=1.3.1
  - ont-fast5-api=4.1.3
  - progressbar33=2.4
  - mappy>=2.31
  - medaka=2.2.1
  - minimap2=2.28
  - checkm-genome=1.2.4
  - flye=2.9.6
  - bwa=0.7.19
  - mummer=3.23
  - pplacer=1.1.alpha19
  - gtdbtk=2.7.2
  - hmmer=3.4
  - prodigal=2.6.3
  - unicycler=0.5.1
  - spades=4.3.0
  - megahit=1.2.9
  - nanofilt=2.8.0
  - rasusa=5.1.0
  - miniasm=0.3
  - racon=1.5.0
  - git=2.55.0
  - pip=26.2.1
  - setuptools>=75,<81
  - seqkit=2.13.0
  - fastani=1.34
  - skani=0.3.2
  - parallel=20260722
  - pomoxis=0.4.2
  - h5py=3.16.0
  # Bakta third-party tools (pip bakta does not install these binaries).
  # prokka is omitted: it pins Perl 5.26 and conflicts with tRNAscan-SE 2.x / Infernal 1.1.5.
  - trnascan-se=2.0.12
  - aragorn=1.2.41
  - infernal=1.1.5
  - piler-cr=1.06
  - diamond=2.2.0
  - blast=2.14.0
  - ncbi-amrfinderplus=4.2.7
  - r-base=4.4.3
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-igraph=2.3.3
  - r-biocmanager=1.30.27
  - pip:
    - bakta>=1.12.0
    - pyrodigal>=3.5.0
    - pyhmmer>=0.10.15
    - pyCirclize==1.10.1
    - ont-parasail==1.3.4
    - circlator==1.5.5
    - pytmler==0.1.3
    - bokeh==3.9.2
    - flask==3.1.3
    - psutil==7.1.2
    - plotly==6.3.1
    - quast==5.2.0