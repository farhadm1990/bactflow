# Conda environment for the unified Docker image.
# Do not pass this file to `docker compose -f` or `docker build -f`.
# Build with:
#   docker compose -f docker-compose.yml up --build
#   docker build -f UI/bactflow_app/Dockerfile -t bactflow:v1.0 .
name: bactflow
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - libopenblas
  # QC
  - seqkit=2.13.0
  - parallel=20260722
  # Assembly
  - flye=2.9.6
  - spades=4.3.0
  - unicycler=0.5.1
  - bowtie2
  - minimap2=2.28
  - racon=1.5.0
  - miniasm=0.3
  - rasusa=5.1.0
  - nanofilt=2.8.0
  - bwa=0.7.19
  - mummer=3.23
  - prodigal=2.6.3
  # Post-assembly (databases stay on the host)
  - checkm-genome=1.2.4
  - genomad=1.11.1
  - gtdbtk=2.6.1
  - pplacer=1.1.alpha19
  - hmmer=3.4
  - samtools=1.23.1
  - bcftools=1.23.1
  - htslib=1.23.1
  - fastani=1.34
  - skani=0.3.2
  - trnascan-se=2.0.12
  - aragorn=1.2.41
  - infernal=1.1.5
  - piler-cr=1.06
  - diamond=2.2.0
  - ncbi-amrfinderplus=4.2.7
  # PubMLST typing (Torsten Seemann mlst; pulls any2fasta + scheme DBs)
  - mlst=2.23.0
  - numpy
  - pandas
  - biopython
  - matplotlib
  - matplotlib-base
  - libraqm>=0.10.1
  - pysam
  - setuptools>=75,<81
  - pip
  - r-base=4.4.3
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-tidyr
  - r-tibble
  - r-readr
  - r-stringr
  - r-purrr
  - r-optparse
  - r-glue
  - r-ape
  - r-pheatmap
  - r-rcolorbrewer
  - r-biocmanager=1.30.27
  - bioconductor-matrixgenerics=1.18.0
  - bioconductor-biostrings
  - pip:
      - bakta==1.12.0
      - pyrodigal>=3.5.0
      - pyhmmer>=0.10.15
      - pyCirclize==1.10.1
      - circlator==1.5.5
      - flask==3.1.3
      - plotly==6.3.1
      - psutil==7.1.2
      - quast==5.2.0
      - reportlab==4.2.5
