# Sidecar conda env for PubMLST (Torsten Seemann mlst).
# Kept separate: perl-bioperl conflicts with infernal/samtools/spades pins
# in the main bactflow image. Used by mlst_run.sh as bactflow_mlst.
name: bactflow_mlst
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - mlst=2.23.0
