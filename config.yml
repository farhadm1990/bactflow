name: bactflow
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- runtime (all three modules) ---
  - curl=8.21.0
  - libcurl=8.21.0
  - pkg-config=0.29.2
  - python=3.11.0
  # Nextflow 24.x requires Java 17-24; do not upgrade to OpenJDK 25+
  - openjdk=21
  - nextflow=24.10.2
  - git=2.55.0
  - pip=26.2.1
  - setuptools>=75,<81
  - parallel=20260722
  - libopenblas
  - perl
  - gsl=2.7

  # --- shared Python / UI ---
  - numpy=2.4.6
  - pandas=3.0.5
  - biopython=1.88
  - pysam=0.23.0
  # matplotlib 3.10+ links ft2font against libraqm. Without a conda
  # libraqm, Bakta loads the OS library and dies with
  # undefined symbol: raqm_clear_contents.
  - matplotlib
  - matplotlib-base
  - libraqm>=0.10.1
  - h5py=3.16.0
  # hdf5 2.x (via h5py/medaka) links ROS3/AWS; without these medaka dies with:
  # ImportError: libaws-c-s3.so.0unstable: cannot open shared object file
  - aws-c-s3
  - aws-c-auth
  - aws-c-http
  - aws-c-io

  # --- pre-assembly (seqkit stats, pooling, plots) ---
  - seqkit=2.13.0

  # --- assembly (Flye / SPAdes / Unicycler / PacBio / polish / circulate) ---
  - flye=2.9.6
  - spades=4.3.0
  - unicycler=0.5.1
  - megahit=1.2.9
  - miniasm=0.3
  - racon=1.5.0
  - bowtie2
  - minimap2=2.28
  - bwa=0.7.19
  - mummer=3.23
  - pilon
  - nanofilt=2.8.0
  - rasusa=5.1.0
  - pbccs=6.4.0
  - pbtk=3.1.1
  - medaka=2.2.1
  - pomoxis=0.4.2
  - nanomath=1.4.0
  - ont-fast5-api=4.1.3
  - tensordict=0.11.0
  - mappy>=2.31
  - deprecated=1.3.1
  - progressbar33=2.4

  # --- mapping / variants (post-assembly SNP finder + polish) ---
  - htslib=1.23.1
  - samtools=1.23.1
  - bcftools=1.23.1

  # --- post-assembly: Bakta (pip bakta does not install these binaries) ---
  # prokka is omitted: it pins Perl 5.26 and conflicts with tRNAscan-SE 2.x / Infernal 1.1.5.
  - trnascan-se=2.0.12
  - aragorn=1.2.41
  - infernal=1.1.5
  - piler-cr=1.06
  - diamond=2.2.0
  - blast=2.17.0
  - ncbi-amrfinderplus=4.2.7
  - prodigal=2.6.3
  - hmmer=3.4

  # --- post-assembly: taxonomy / completeness / MGEs ---
  # R232 reference package (folder often named release32) needs GTDB-Tk >= 2.7
  - gtdbtk=2.8.0
  - checkm-genome=1.2.4
  - pplacer=1.1.alpha19
  - fastani=1.34
  - skani=0.3.2
  # geNomad plasmid / MGE detection (pulls mmseqs2, tensorflow, etc.)
  - genomad=1.11.1
  # mlst is NOT here — perl-bioperl conflicts with blast/samtools/infernal.
  # Use the sidecar env: UI/bactflow_app/environment.mlst.yml (bactflow_mlst).

  # --- post-assembly: R plots and CheckM MSA tree ---
  - r-base=4.4.3
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-tidyr
  - r-tibble
  - r-readr
  - r-stringr
  - r-purrr
  - r-optparse
  - r-glue
  - r-ape
  - r-pheatmap
  - r-rcolorbrewer
  - r-seqinr
  - r-patchwork
  - r-biocmanager=1.30.27
  - bioconductor-matrixgenerics=1.18.0
  - bioconductor-biostrings
  - bioconductor-msa

  - pip:
    - bakta==1.12.0
    # Bakta runtime deps (must live in the env; user-site installs are invisible to Nextflow)
    - xopen>=1.0
    - alive-progress>=3.0
    - pyrodigal>=3.5.0
    - pyhmmer>=0.10.15
    - pyCirclize==1.10.1
    - ont-mappy
    - ont-parasail==1.3.4
    - circlator==1.5.5
    - pytmler==0.1.3
    - bokeh==3.9.2
    - flask==3.1.3
    - psutil==7.1.2
    - plotly==6.3.1
    - quast==5.2.0
    - reportlab==4.2.5
